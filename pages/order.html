  <a class="logo" href="../index.html"><span class="logo-mark">🧸</span>בייבי בלום</a>
  <nav aria-label="ניווט ראשי"><ul class="nav-list">

<main><section class="page-banner"><h1>טופס הזמנה</h1><p>מלאו את הפרטים ונחזור אליכם</p></section><section class="content-section">
<form class="order-form" action="success.html" method="get">
<div class="form-field"><label for="full-name">שם מלא</label><input id="full-name" name="full-name" type="text" minlength="2" required></div>
<div class="form-field"><label for="phone">טלפון</label><input id="phone" name="phone" type="tel" pattern="[0-9]{9,10}" placeholder="0501234567" required></div>
<div class="form-field"><label for="email">דואר אלקטרוני</label><input id="email" name="email" type="email" required></div>
<div class="form-field"><label for="birth-date">תאריך לידה משוער</label><input id="birth-date" name="birth-date" type="date"></div>
<div class="form-field"><label for="product">מוצר</label><select id="product" name="product" required><option value="">בחרו מוצר</option><option>עגלת נוחות</option><option>מיטת חלומות</option><option>סט בגדים רך</option><option>ערכת משחק ראשונה</option></select></div>
<div class="form-field"><label for="quantity">כמות</label><input id="quantity" name="quantity" type="number" min="1" max="10" value="1" required></div>
<div class="form-field full"><label for="notes">הערות</label><textarea id="notes" name="notes" rows="4" maxlength="250"></textarea></div>
<div class="form-actions"><button class="button" type="submit">שליחת הזמנה</button><button class="button secondary" type="reset">איפוס</button></div>
</form></section></main>
<footer class="site-footer"><span>© 2026 בייבי בלום. כל הזכויות שמורות.</span><span><a href="about.html">אודות</a> | <a href="../assets/files/project-instructions.pdf" target="_blank">קובץ הנחיות PDF</a></span></footer>
</body></html>
